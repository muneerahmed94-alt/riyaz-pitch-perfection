<!DOCTYPE html>
<!--
  Riyaz — Pitch Perfection
  ========================
  A single-file, dependency-free web app for practicing Hindustani classical
  swaras (S r R g G m M P d D n N) against a chosen Sa (shruti).

  How it works, end to end:
    1. The user picks a Shruti (Sa) as an explicit note+octave (e.g. B2) and a
       vertical Range (which saptaks to show). Sa's absolute frequency is
       derived from its MIDI number.
    2. On "Practice", we request the microphone via getUserMedia and feed it
       into a Web Audio AnalyserNode.
    3. Each animation frame we grab a time-domain buffer and run the McLeod
       Pitch Method / NSDF detector (see detectPitch) to estimate the sung
       fundamental frequency in Hz — robust against octave-halving on higher
       notes.
    4. The frequency is converted to "semitones above Sa" (freqToRel), snapped
       to the nearest swara, and the cents-off-from-perfect drives the colour:
       green (±10¢) / teal (±20¢) / yellow (±35¢) / red (further off).
    5. The pitch is plotted as a scrolling coloured trail on a <canvas> grid
       whose horizontal lines are the swaras.

  Optional MIDI keyboard (footer "🎹 MIDI" button + ⚙ config): connect an
  external keyboard via the Web MIDI API to play a harmonium drone/reference
  alongside your singing. Notes are voiced by the same physically-modelled
  harmonium synth as the riyaz-palta-alankar sibling (source-filter model:
  reed PeriodicWave → per-brand cabinet biquads → room reverb; see the MIDI
  KEYBOARD section), with Brand/Reed/Coupler and Octave/Transpose controls.

  Optional metronome (footer "Metronome" button + ⚙ config): a look-ahead
  scheduled click track with adjustable BPM, beats-per-bar, and tap tempo
  (see the METRONOME section).

  Everything lives in this one HTML file — no build step, no dependencies.
  Note: the pitch model uses 12-tone equal temperament, not just intonation.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riyaz — Pitch Perfection</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Shared "Riyaz" design language: parchment background, burnt-sienna
     accents, Lora serif for display type, Poppins for UI. Matches the
     riyaz-palta-alankar and riyaz-phrase-looper sibling apps. */
  :root {
    --bg: #f0e6cf;
    --panel: #f7edd6;      /* cream panel */
    --panel-2: #fdf6e3;    /* lighter cream for inputs */
    --line: #d9c9a3;       /* soft parchment border */
    --line-strong: #b5995a;
    --text: #5c3317;       /* warm brown text */
    --muted: #a1887f;      /* muted brown */
    --accent: #d45a00;     /* burnt sienna */
    --accent-dark: #bf4020;
    --green: #2e7d32;      /* elite lock — deep green (±10¢) */
    --teal: #1a9e94;       /* good — teal (±20¢), clearly distinct from green */
    --yellow: #c9963e;     /* gold */
    --red: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    background-image: linear-gradient(160deg, #f5eed8 0%, #ecdfc4 40%, #e8d5b7 100%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 16px;
    overflow: hidden;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
  select, button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1.5px solid var(--line-strong);
    border-radius: 8px;
    padding: 9px 12px;
    outline: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  select:focus { border-color: var(--accent); background: #fff; }
  select { min-width: 150px; }
  .btn-primary {
    background: var(--accent);
    color: #fff8ec;
    border: 1.5px solid var(--accent);
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(90,40,10,0.2);
    align-self: flex-end;
    height: 46px;
    padding: 0 24px;
  }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-primary.stop { background: var(--accent-dark); border-color: #943010; color: #fff8ec; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  .stage {
    width: 100%;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1.5px solid var(--line-strong);
    border-radius: 12px;
    padding: 14px;
    position: relative;
    box-shadow: 0 4px 16px rgba(90,40,10,0.12);
  }
  canvas { width: 100%; height: 460px; display: block; border-radius: 10px; }
  .graph-scroll { flex: 1; min-height: 0; overflow-y: auto; border-radius: 10px; }

  .footer {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    margin-top: 12px;
    padding-bottom: 10px;
    flex-wrap: wrap;
  }
  .footer-left, .footer-right {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .note-block { position: relative; align-self: flex-end; }
  .metrics {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    display: flex;
    justify-content: center;
    gap: 12px;
    white-space: nowrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1.5px solid var(--line-strong);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    height: 46px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
  .dot.blinking { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  .big { font-family: 'Lora', Georgia, serif; font-size: 26px; font-weight: 700; min-width: 60px; }
  .cents { color: var(--muted); font-size: 13px; }
  .status { color: var(--muted); font-size: 13px; align-self: center; }
  .legend {
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    align-self: center;
    text-align: center;
    flex: 1;
    white-space: nowrap;
  }
  .legend b { font-size: 15px; vertical-align: -1px; }

  /* ── Combined button group + config popover (MIDI, Metronome) ── */
  .midi-group, .metro-group { display: inline-flex; align-self: flex-end; position: relative; }
  .midi-group > button, .metro-group > button {
    border-radius: 0;
    margin: 0;
    height: 46px;
  }
  .midi-group > button:first-child, .metro-group > button:first-child { border-radius: 8px 0 0 8px; }
  .midi-group > button:last-of-type, .metro-group > button:last-of-type { border-radius: 0 8px 8px 0; border-left: none; }
  #midiToggle.connected, #metroToggle.on {
    background: var(--green);
    border-color: var(--green);
    color: #fff8ec;
  }
  #midiToggle.connected:hover, #metroToggle.on:hover { background: #256828; border-color: #256828; }
  #midiConfigBtn, #metroConfigBtn { padding: 0 12px; }
  #metroToggle { display: inline-flex; align-items: center; gap: 7px; }
  .metro-icon { vertical-align: -3px; }

  .midi-popover, .metro-popover {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    gap: 10px;
    min-width: 220px;
    padding: 14px;
    background: var(--panel);
    border: 1.5px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(90,40,10,0.22);
  }
  .midi-popover.open, .metro-popover.open { display: flex; }
  .midi-popover .field, .metro-popover .field { gap: 4px; }
  .midi-popover select, .metro-popover select { min-width: 100%; }
  .midi-status { font-size: 11px; color: var(--muted); }
  .midi-adj, .metro-adj { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .midi-adj > span:first-child, .metro-adj > span:first-child { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
  .midi-adj .stepper, .metro-adj .stepper { display: inline-flex; align-items: center; gap: 8px; }
  .midi-adj .stepper button, .metro-adj .stepper button { width: 30px; height: 30px; padding: 0; font-weight: 700; }
  .midi-adj .val, .metro-adj .val { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  .midi-check, .metro-check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); cursor: pointer; }
  .midi-check input, .metro-check input { accent-color: var(--accent); cursor: pointer; }

  /* ── Metronome popover specifics ── */
  .metro-popover { min-width: 260px; }
  .metro-bpm-display { text-align: center; font-family: 'Lora', Georgia, serif; }
  .metro-bpm-display .bpm-num {
    font-family: 'Lora', Georgia, serif;
    font-size: 34px; font-weight: 700; line-height: 1;
    width: 100px; text-align: center;
    color: var(--text); background: transparent;
    border: none; border-bottom: 2px solid transparent;
    padding: 0; border-radius: 0; cursor: text;
  }
  .metro-bpm-display .bpm-num:hover { border-bottom-color: var(--line-strong); }
  .metro-bpm-display .bpm-num:focus { outline: none; border-bottom-color: var(--accent); background: transparent; }
  /* hide number-input spinners for a clean look */
  .metro-bpm-display .bpm-num::-webkit-inner-spin-button,
  .metro-bpm-display .bpm-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .metro-bpm-display .bpm-num { -moz-appearance: textfield; }
  .metro-bpm-display .bpm-unit { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  .metro-bpm-row { display: flex; align-items: center; gap: 10px; }
  .metro-bpm-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .metro-round { width: 34px; height: 34px; border-radius: 50%; padding: 0; font-weight: 700; font-size: 18px; flex: none; }
  .metro-beats { display: flex; justify-content: center; gap: 10px; padding: 2px 0; }
  .metro-beats .beat { width: 16px; height: 16px; border-radius: 50%; background: var(--line); transition: background 0.05s, transform 0.05s; }
  .metro-beats .beat.accent { box-shadow: inset 0 0 0 2px var(--line-strong); }
  .metro-beats .beat.active { background: var(--green); transform: scale(1.15); }
  .metro-beats .beat.active.accent { background: var(--accent); }
  .metro-btns { display: flex; gap: 8px; }
  .metro-btns button { flex: 1; height: 40px; white-space: nowrap; padding: 0 10px; }
  #metroStartStop.running { background: var(--accent-dark); border-color: #943010; color: #fff8ec; }
</style>
</head>
<body>
  <div class="stage">
    <div class="graph-scroll">
      <canvas id="graph"></canvas>
    </div>
    <div class="footer">
      <div class="footer-left">
        <div class="field">
          <label for="shrutiSelect">Shruti (Sa)</label>

        <div class="field">

          <button id="metroConfigBtn" title="Metronome settings" aria-label="Metronome settings">⚙</button>

<script>
(() => {
  "use strict";

  // ---- Swaras: semitone offset from Sa -> label ----
  const SWARAS = [
    { off: 0,  label: "S"  },
    { off: 1,  label: "r"  },
    { off: 2,  label: "R"  },
    { off: 3,  label: "g"  },
    { off: 4,  label: "G"  },
    { off: 5,  label: "m"  },
    { off: 6,  label: "M"  },
    { off: 7,  label: "P"  },
    { off: 8,  label: "d"  },
    { off: 9,  label: "D"  },
    { off: 10, label: "n"  },
    { off: 11, label: "N"  },
    { off: 12, label: "Ṡ"  },
  ];

  const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  // ---- DOM ----
  const shrutiSelect = document.getElementById("shrutiSelect");
  const rangeSelect = document.getElementById("rangeSelect");
  const practiceBtn = document.getElementById("practiceBtn");
  const canvas = document.getElementById("graph");
  const ctx = canvas.getContext("2d");
  const noteName = document.getElementById("noteName");
  const centsText = document.getElementById("centsText");
  const freqText = document.getElementById("freqText");
  const statusText = document.getElementById("statusText");
  const statusDot = document.getElementById("statusDot");

  // Populate shruti selector with explicit note+octave (e.g. C3, B2).
  // value = MIDI note number. C3 = 48, B2 = 47, etc.
  // Practical Sa range for Hindustani voices: A2 (male, low) up to A3 (female).
  for (let midi = 45; midi <= 57; midi++) {
    const name = NOTE_NAMES[midi % 12];
    const oct = Math.floor(midi / 12) - 1;   // MIDI octave (C4 = middle C)
    const opt = document.createElement("option");
    opt.value = midi;
    opt.textContent = name + oct;
    if (midi === 47) opt.selected = true;    // default B2
    shrutiSelect.appendChild(opt);
  }

  // ---- Audio state ----
  let audioCtx = null;
  let analyser = null;
  let sourceNode = null;
  let mediaStream = null;
  let rafId = null;
  let running = false;
  let buf = null;
  let smoothRel = null;   // smoothed semitone position for steadier tracking

  // ---- Pitch geometry (log-frequency mapping) ----
  // We map a vertical range that spans a bit below Sa to a bit above upper Sa.
  function saFrequency() {
    const midi = parseInt(shrutiSelect.value, 10);   // MIDI note number of Sa
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // vertical range in semitones relative to Sa (depends on selected Range)
  function rangeBounds() {
    switch (rangeSelect.value) {
      case "mandra-sa":       // Mandra Sa (-12) up to Madhya Sa (0)
        return { low: -12, high: 0 };
      case "madhya-sa":       // Madhya Sa (0) up to Taar Sa (+12)
        return { low: 0, high: 12 };
      case "taar-sa":         // Taar Sa (+12) up to Ati-taar Sa (+24)
        return { low: 12, high: 24 };
      case "mandraP-taarP":   // Mandra Pa (-5) up to Taar Pa (+19)
      default:
        return { low: -5, high: 19 };
    }
  }
  let RANGE_LOW = -5;
  let RANGE_HIGH = 19;
  function refreshRange() {
    const b = rangeBounds();
    RANGE_LOW = b.low;
    RANGE_HIGH = b.high;
  }
  refreshRange();

  // Build the list of swara lines to draw across the current range.
  function activeLines() {
    const lines = [];
    for (let off = Math.ceil(RANGE_LOW); off <= Math.floor(RANGE_HIGH); off++) {
      lines.push({ off, label: labelForOffset(off), isSa: (((off % 12) + 12) % 12) === 0 });
    }
    return lines;
  }

  // ---- Scrolling pitch history ----
  const history = [];      // {rel: semitonesFromSa, color}
  const MAX_POINTS = 600;

  // ---- Resize canvas for crisp rendering ----
  const PX_PER_SEMITONE = 34;   // vertical gap between adjacent swara lines
  const PAD_Y = 24;
  function resizeCanvas() {
    // Height scales with the range so line spacing stays generous.
    // (The graph area scrolls; we auto-scroll to the bottom so the lowest
    // swara — e.g. P. for Mandra Pa → Taar Pa — is visible at start.)
    const span = RANGE_HIGH - RANGE_LOW;
    const cssHeight = span * PX_PER_SEMITONE + PAD_Y * 2;
    canvas.style.height = cssHeight + "px";
    const scroller = canvas.parentElement;
    scroller.scrollTop = scroller.scrollHeight;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", () => { resizeCanvas(); draw(); });

  function relToY(rel) {
    const rect = canvas.getBoundingClientRect();
    const h = rect.height - PAD_Y * 2;
    const t = (rel - RANGE_LOW) / (RANGE_HIGH - RANGE_LOW);   // 0 bottom .. 1 top
    return PAD_Y + (1 - t) * h;
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);

    const leftPad = 44;

    // Draw swara lines
    const lines = activeLines();
    // With a wide range, lines get dense — thin them and their labels a touch.
    const dense = lines.length > 20;
    for (const sw of lines) {
      const y = relToY(sw.off);
      const isSa = sw.isSa;
      ctx.beginPath();
      ctx.moveTo(leftPad, y);
      ctx.lineTo(W - 8, y);
      ctx.lineWidth = isSa ? 4 : (dense ? 2.5 : 3);
      ctx.strokeStyle = isSa ? "#d45a00" : "#c9b489";
      ctx.stroke();

      // label
      ctx.fillStyle = isSa ? "#bf4020" : "#a1887f";
      ctx.font = (isSa ? "bold " : "") + (dense ? "12px" : "14px") + " 'Lora', Georgia, serif";
      ctx.textBaseline = "middle";
      ctx.fillText(sw.label, 14, y);
    }

    // Draw the sung pitch trail
    if (history.length > 1) {
      const step = (W - leftPad - 8) / MAX_POINTS;
      // draw as colored segments
      for (let i = 1; i < history.length; i++) {
        const p0 = history[i - 1], p1 = history[i];
        if (p0.rel == null || p1.rel == null) continue;
        const x0 = leftPad + (i - 1) * step;
        const x1 = leftPad + i * step;
        ctx.beginPath();
        ctx.moveTo(x0, relToY(p0.rel));
        ctx.lineTo(x1, relToY(p1.rel));
        ctx.lineWidth = 3;   // match reference swara line thickness
        ctx.lineCap = "round";
        ctx.strokeStyle = p1.color;
        ctx.stroke();
      }
      // leading dot
      const last = history[history.length - 1];
      if (last.rel != null) {
        const x = leftPad + (history.length - 1) * step;
        ctx.beginPath();
        ctx.arc(x, relToY(last.rel), 6, 0, Math.PI * 2);
        ctx.fillStyle = last.color;
        ctx.fill();
      }
    }
  }

  // ---- Pitch detection: McLeod Pitch Method (NSDF) ----
  // We only search lags in a plausible singing range, and — crucially — we
  // pick the FIRST NSDF peak that clears 90% of the maximum peak, not the
  // global maximum. A plain autocorrelation tends to peak just as strongly at
  // twice the true period (the sub-harmonic), so it reports HALF the real
  // frequency on higher notes — the classic "octave-halving" error that made
  // N / S' jump around and read the right label at the wrong Hz. Preferring
  // the shortest-lag strong peak locks onto the true fundamental instead.
  const MIN_HZ = 70;    // below Mandra Sa for most voices
  const MAX_HZ = 1100;  // above Taar Sa
  function detectPitch(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1;   // too quiet

    const minLag = Math.max(1, Math.floor(sampleRate / MAX_HZ));
    const maxLag = Math.min(Math.floor(sampleRate / MIN_HZ), SIZE - 1);

    // Normalized Square Difference Function (McLeod & Wyvill, 2005):
    //   nsdf(τ) = 2·Σ x[i]·x[i+τ] / Σ (x[i]² + x[i+τ]²)   ∈ [-1, 1]
    // It peaks at ~1.0 at the true period and its multiples, but the
    // denominator normalizes out the length-of-window bias that skews plain
    // autocorrelation toward lower frequencies.
    const nsdf = new Float32Array(maxLag + 1);
    for (let lag = minLag; lag <= maxLag; lag++) {
      let acf = 0, m = 0;
      for (let i = 0; i < SIZE - lag; i++) {
        acf += buffer[i] * buffer[i + lag];
        m += buffer[i] * buffer[i] + buffer[i + lag] * buffer[i + lag];
      }
      nsdf[lag] = m > 0 ? (2 * acf) / m : 0;
    }

    // Collect local-maxima lags and track the strongest peak value.
    let maxVal = 0;
    const peaks = [];
    for (let lag = minLag + 1; lag < maxLag; lag++) {
      if (nsdf[lag] > nsdf[lag - 1] && nsdf[lag] >= nsdf[lag + 1]) {
        peaks.push(lag);
        if (nsdf[lag] > maxVal) maxVal = nsdf[lag];
      }
    }
    // Require a reasonably periodic signal, else treat as no clear pitch.
    if (peaks.length === 0 || maxVal < 0.5) return -1;

    // Pick the first (shortest-lag) peak that clears 90% of the max — the
    // fundamental, not its octave-down sub-harmonic.
    const threshold = 0.9 * maxVal;
    let chosen = -1;
    for (const p of peaks) {
      if (nsdf[p] >= threshold) { chosen = p; break; }
    }
    if (chosen < 0) return -1;

    // Parabolic interpolation around the chosen peak for sub-sample accuracy.
    let T0 = chosen;
    if (chosen > minLag && chosen < maxLag) {
      const y1 = nsdf[chosen - 1], y2 = nsdf[chosen], y3 = nsdf[chosen + 1];
      const a = (y1 + y3 - 2 * y2) / 2;
      const b = (y3 - y1) / 2;
      if (a) T0 = chosen - b / (2 * a);
    }
    return sampleRate / T0;
  }

  function freqToRel(freq) {
    // semitones above Sa
    return 12 * Math.log2(freq / saFrequency());
  }

  // Map cents deviation to a colour tier. Graded so progress is visible:
  //   ±10¢  green  — elite lock (snapped onto the reference line while drawing)
  //   ±20¢  teal   — good, honest pitch; drawn at the true position
  //   ±35¢  yellow — close
  //   else  red    — off pitch
  function colorForCents(centsOff) {
    const a = Math.abs(centsOff);
    if (a <= 10) return { color: getComputedStyle(document.documentElement).getPropertyValue("--green").trim(), tag: "green" };
    if (a <= 20) return { color: getComputedStyle(document.documentElement).getPropertyValue("--teal").trim(), tag: "good" };
    if (a <= 35) return { color: getComputedStyle(document.documentElement).getPropertyValue("--yellow").trim(), tag: "yellow" };
    return { color: getComputedStyle(document.documentElement).getPropertyValue("--red").trim(), tag: "red" };
  }

  function nearestSwara(rel) {
    // rel = semitones from Sa. The nearest note is simply the nearest
    // semitone, in ANY octave — so singing an octave off still maps to the
    // right swara (just in a lower/upper saptak), not a wildly wrong note.
    const best = Math.round(rel);
    const centsOff = (rel - best) * 100;   // true tuning error, -50..+50
    return { off: best, label: labelForOffset(best), centsOff };
  }

  function labelForOffset(off) {
    const norm = ((off % 12) + 12) % 12;
    const base = SWARAS.find(s => s.off === norm)?.label || "?";
    const octShift = Math.floor(off / 12);   // -1 mandra, 0 madhya, +1 taar, ...
    if (octShift > 0) return base + "'".repeat(octShift);   // taar (upper): S'
    if (octShift < 0) return base + ".".repeat(-octShift);  // mandra (lower): S.
    return base;
  }

  function frame() {
    if (!running) return;
    analyser.getFloatTimeDomainData(buf);
    const freq = detectPitch(buf, audioCtx.sampleRate);

    if (freq > 0) {
      let rel = freqToRel(freq);
      // Octave-error guard: only correct readings that land NEAR a full octave
      // (±1.5 semitones of 12) away from the current pitch — the signature of a
      // detector octave slip. A wider guard would wrongly fold genuine melodic
      // leaps (e.g. S→P, a 7-semitone jump) back by an octave.
      if (smoothRel != null) {
        while (rel - smoothRel > 10.5) rel -= 12;
        while (smoothRel - rel > 10.5) rel += 12;
      }
      // Light exponential smoothing to steady the line.
      smoothRel = smoothRel == null ? rel : smoothRel + (rel - smoothRel) * 0.4;
      rel = smoothRel;
      const { label, centsOff, off } = nearestSwara(rel);
      const { color, tag } = colorForCents(centsOff);
      // When the pitch is "perfect", snap the drawn position exactly onto the
      // swara reference line so the two lines overlap completely (no sliver).
      const drawnRel = tag === "green" ? off : rel;
      // Clamp to the visible range so the line stays on-graph even if the
      // sung pitch is outside the current shruti/range window.
      const clamped = Math.max(RANGE_LOW, Math.min(RANGE_HIGH, drawnRel));
      history.push({ rel: clamped, color });
      noteName.textContent = label;
      noteName.style.color = color;
      statusDot.style.background = color;
      statusDot.classList.remove("blinking");
      centsText.textContent = (centsOff >= 0 ? "+" : "") + centsOff.toFixed(0) + " cents";
      freqText.textContent = freq.toFixed(1) + " Hz";
    } else {
      smoothRel = null;
      history.push({ rel: null, color: "#888" });
      noteName.textContent = "—";
      noteName.style.color = "var(--muted)";
      statusDot.style.background = "var(--red)";
      statusDot.classList.add("blinking");
      centsText.textContent = "";
      freqText.textContent = "";
    }
    while (history.length > MAX_POINTS) history.shift();

    draw();
    rafId = requestAnimationFrame(frame);
  }

  // ---- Microphone + practice ----
  async function startPractice() {
    try {
      resizeCanvas();
      const constraints = {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        },
      };
      mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      sourceNode = audioCtx.createMediaStreamSource(mediaStream);
      sourceNode.connect(analyser);

      running = true;
      history.length = 0;
      smoothRel = null;
      practiceBtn.textContent = "■ Stop";
      practiceBtn.classList.add("stop");
      statusText.textContent = "";
      frame();
    } catch (e) {
      statusText.textContent = "Could not start: " + e.message;
    }
  }

  function stopPractice() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (sourceNode) sourceNode.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    audioCtx = null; analyser = null; sourceNode = null; mediaStream = null;
    practiceBtn.textContent = "▶ Practice";
    practiceBtn.classList.remove("stop");
    statusText.textContent = "";
    noteName.textContent = "—";
    noteName.style.color = "var(--muted)";
    statusDot.style.background = "var(--muted)";
    statusDot.classList.remove("blinking");
    centsText.textContent = "";
    freqText.textContent = "";
  }

  practiceBtn.addEventListener("click", () => {
    if (running) stopPractice(); else startPractice();
  });

  // Redraw grid when shruti/octave/range change
  shrutiSelect.addEventListener("change", draw);
  rangeSelect.addEventListener("change", () => { refreshRange(); resizeCanvas(); draw(); });

  // ─────────────────────────────────────────────────────────────
  //  MIDI KEYBOARD
  //  Connect an external MIDI keyboard (Web MIDI API) to play along
  //  while practicing. Notes are voiced by the same physically-modelled
  //  harmonium synth used in the riyaz-palta-alankar sibling app — a
  //  source-filter model (reed PeriodicWave → per-brand wooden-cabinet
  //  biquad chain → small-room convolution reverb) with a multi-reed
  //  bank, bellows LFO, and attack chiff. It runs on its own persistent
  //  AudioContext, independent of the mic/pitch engine.
  //  Octave/Transpose shift the keyboard to your Sa.
  // ─────────────────────────────────────────────────────────────
  const midiToggle = document.getElementById("midiToggle");
  const midiConfigBtn = document.getElementById("midiConfigBtn");
  const midiPopover = document.getElementById("midiPopover");
  const midiDeviceSelect = document.getElementById("midiDeviceSelect");
  const midiBrandSelect = document.getElementById("midiBrandSelect");
  const midiReedSelect = document.getElementById("midiReedSelect");
  const midiCouplerSelect = document.getElementById("midiCouplerSelect");
  const midiVelocity = document.getElementById("midiVelocity");
  const midiStatus = document.getElementById("midiStatus");
  const midiOctVal = document.getElementById("midiOctVal");
  const midiTransVal = document.getElementById("midiTransVal");

  let midiAccess = null;        // MIDIAccess instance
  let midiInput = null;         // currently listening MIDIInput
  let midiAudioCtx = null;      // persistent AudioContext for playback
  let midiCompressor = null;    // shared limiter into destination
  const midiVoices = new Map(); // midi note number -> { release() }
  let midiOctaveShift = 0;      // ±3 octaves
  let midiTranspose = 0;        // ±12 semitones

  function midiNoteToFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function fmtShift(v) { return v > 0 ? "+" + v : "" + v; }

  function ensureMidiAudio() {
    if (!midiAudioCtx || midiAudioCtx.state === "closed") {
      midiAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      midiCompressor = midiAudioCtx.createDynamicsCompressor();
      midiCompressor.threshold.value = -20;
      midiCompressor.knee.value = 20;
      midiCompressor.ratio.value = 4;
      midiCompressor.connect(midiAudioCtx.destination);
    }
    if (midiAudioCtx.state === "suspended") midiAudioCtx.resume();
  }

  // ── Harmonium synth (ported from riyaz-palta-alankar) ─────────
  //  A source-filter model after Puranik & Scavone (DAFx 2023):
  //    • Reed source — a 32-partial PeriodicWave matching a measured
  //      hand-harmonium LTAS (strong f0/2f, 4f notch, buzzy 5–12 plateau).
  //    • Cabinet filter — a per-brand cascade of peaking biquads +
  //      shelves + lowpass, the "wooden box" voice that distinguishes
  //      Paul & Co / Pakrashi / DSR / MKS.
  //    • Reed bank — multi-reed stops (bass/male/female octaves), each a
  //      detuned voice with its own micro-drift for natural chorus.
  //    • Bellows LFO — shallow, per-note-phase amplitude + pitch wobble.
  //    • Chiff — brief filtered-noise onset burst.
  //    • Room reverb — a shared synthetic small-room convolution tail so
  //      successive notes bleed together like a real instrument.
  const _harmoniumReedWaveCache = new WeakMap();
  function getHarmoniumReedWave(audioCtx) {
    const cached = _harmoniumReedWaveCache.get(audioCtx);
    if (cached) return cached;
    const HARM = [
      0.00, 1.00, 0.88, 0.65, 0.28, 0.40, 0.36, 0.38, 0.32, 0.34,
      0.30, 0.25, 0.22, 0.18, 0.14, 0.12, 0.10, 0.085, 0.075, 0.060,
      0.050, 0.042, 0.035, 0.028, 0.022, 0.018, 0.014, 0.011, 0.008,
      0.006, 0.005, 0.004, 0.003,
    ];
    const real = new Float32Array(HARM.length);
    const imag = new Float32Array(HARM.length);
    for (let i = 1; i < HARM.length; i++) imag[i] = HARM[i];
    const wave = audioCtx.createPeriodicWave(real, imag, { disableNormalization: false });
    _harmoniumReedWaveCache.set(audioCtx, wave);
    return wave;
  }

  const HARMONIUM_BRANDS = {
    'paul-co': { name: 'Paul & Co', reedTrim: 0.0, filters: [
      { type: 'peaking',   freq:  180, Q: 1.2, gain:  3.0 },
      { type: 'peaking',   freq:  520, Q: 1.4, gain: -2.5 },
      { type: 'peaking',   freq:  950, Q: 1.8, gain:  4.5 },
      { type: 'peaking',   freq: 1600, Q: 2.2, gain:  5.5 },
      { type: 'peaking',   freq: 2700, Q: 2.0, gain:  2.5 },
      { type: 'highshelf', freq: 4500, Q: 0.7, gain: -9.0 },
      { type: 'lowpass',   freq: 7000, Q: 0.5, gain:  0.0 },
    ] },
    'pakrashi': { name: 'Pakrashi', reedTrim: -1.0, filters: [
      { type: 'peaking',   freq:  160, Q: 1.1, gain:  2.0 },
      { type: 'peaking',   freq:  700, Q: 1.6, gain:  3.0 },
      { type: 'peaking',   freq: 1200, Q: 1.8, gain:  4.0 },
      { type: 'peaking',   freq: 2400, Q: 2.4, gain:  6.0 },
      { type: 'peaking',   freq: 3600, Q: 1.8, gain:  3.0 },
      { type: 'highshelf', freq: 5000, Q: 0.7, gain: -5.0 },
      { type: 'lowpass',   freq: 8500, Q: 0.5, gain:  0.0 },
    ] },
    'dsr': { name: 'DSR', reedTrim: 0.0, filters: [
      { type: 'peaking',   freq:  200, Q: 1.0, gain:  2.0 },
      { type: 'peaking',   freq:  600, Q: 1.2, gain: -3.0 },
      { type: 'peaking',   freq: 1100, Q: 1.8, gain:  4.0 },
      { type: 'peaking',   freq: 2000, Q: 2.0, gain:  4.0 },
      { type: 'peaking',   freq: 3200, Q: 2.0, gain:  3.5 },
      { type: 'highshelf', freq: 5000, Q: 0.7, gain: -6.0 },
      { type: 'lowpass',   freq: 8000, Q: 0.5, gain:  0.0 },
    ] },
    'mks': { name: 'MKS', reedTrim: -0.5, filters: [
      { type: 'peaking',   freq:  230, Q: 1.4, gain:  2.5 },
      { type: 'peaking',   freq:  550, Q: 1.3, gain: -2.0 },
      { type: 'peaking',   freq: 1200, Q: 2.4, gain:  5.5 },
      { type: 'peaking',   freq: 2200, Q: 2.0, gain:  4.5 },
      { type: 'peaking',   freq: 3500, Q: 1.8, gain:  3.5 },
      { type: 'highshelf', freq: 5500, Q: 0.7, gain: -4.0 },
      { type: 'lowpass',   freq: 9000, Q: 0.5, gain:  0.0 },
    ] },
  };

  function buildHarmoniumCabinet(audioCtx, brand) {
    const spec = HARMONIUM_BRANDS[brand] || HARMONIUM_BRANDS['paul-co'];
    const input = audioCtx.createGain();
    input.gain.value = 1;
    let last = input;
    const nodes = [];
    for (const f of spec.filters) {
      const b = audioCtx.createBiquadFilter();
      b.type = f.type;
      b.frequency.value = f.freq;
      b.Q.value = f.Q;
      if (f.type !== 'lowpass') b.gain.value = f.gain;
      last.connect(b);
      last = b;
      nodes.push(b);
    }
    const trim = audioCtx.createGain();
    trim.gain.value = Math.pow(10, spec.reedTrim / 20);
    last.connect(trim);
    return { input, output: trim, nodes };
  }

  const _harmoniumIRCache = new WeakMap();
  function getHarmoniumRoomIR(audioCtx) {
    const cached = _harmoniumIRCache.get(audioCtx);
    if (cached) return cached;
    const sr = audioCtx.sampleRate;
    const length = Math.floor(sr * 1.8);
    const buffer = audioCtx.createBuffer(2, length, sr);
    const earlyReflections = [
      { tL: 0.013, tR: 0.017, amp: 0.55 },
      { tL: 0.024, tR: 0.021, amp: 0.45 },
      { tL: 0.032, tR: 0.036, amp: 0.38 },
      { tL: 0.047, tR: 0.043, amp: 0.30 },
      { tL: 0.059, tR: 0.065, amp: 0.25 },
      { tL: 0.078, tR: 0.074, amp: 0.18 },
    ];
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      let lpState = 0;
      const lpCoef = 0.35;
      const decayK = Math.log(1000) / (1.2 * sr);
      for (let i = 0; i < length; i++) {
        const noise = (Math.random() * 2 - 1);
        lpState = lpState * (1 - lpCoef) + noise * lpCoef;
        data[i] = lpState * Math.exp(-decayK * i) * 0.35;
      }
      for (const r of earlyReflections) {
        const t = ch === 0 ? r.tL : r.tR;
        const idx = Math.floor(t * sr);
        if (idx < length) {
          for (let k = 0; k < 8; k++) {
            data[idx + k] += r.amp * (1 - k / 8) * (Math.random() * 0.4 + 0.8);
          }
        }
      }
      const gap = Math.floor(sr * 0.003);
      for (let i = 0; i < gap; i++) data[i] = 0;
    }
    _harmoniumIRCache.set(audioCtx, buffer);
    return buffer;
  }

  const _harmoniumReverbBusCache = new WeakMap();
  function getHarmoniumReverbBus(audioCtx, finalDest) {
    const cached = _harmoniumReverbBusCache.get(audioCtx);
    if (cached) return cached;
    const input = audioCtx.createGain();
    input.gain.value = 1;
    const dryGain = audioCtx.createGain();
    dryGain.gain.value = 0.82;
    input.connect(dryGain);
    dryGain.connect(finalDest);
    const wetHP = audioCtx.createBiquadFilter();
    wetHP.type = 'highpass'; wetHP.frequency.value = 180; wetHP.Q.value = 0.7;
    const wetLP = audioCtx.createBiquadFilter();
    wetLP.type = 'lowpass'; wetLP.frequency.value = 5500; wetLP.Q.value = 0.5;
    const convolver = audioCtx.createConvolver();
    convolver.buffer = getHarmoniumRoomIR(audioCtx);
    convolver.normalize = true;
    const wetGain = audioCtx.createGain();
    wetGain.gain.value = 0.28;
    input.connect(wetHP);
    wetHP.connect(wetLP);
    wetLP.connect(convolver);
    convolver.connect(wetGain);
    wetGain.connect(finalDest);
    const bus = { input, dryGain, wetGain, convolver };
    _harmoniumReverbBusCache.set(audioCtx, bus);
    return bus;
  }

  function createHarmoniumNote(audioCtx, dest, freq, startTime, duration, reedType, leftCoupler, rightCoupler, brand) {
    const oscillators = [];
    brand = brand || 'paul-co';

    const reeds = [];
    if (reedType === 'male-male-female-bass') {
      reeds.push({ freq: freq,     amp: 1.00, detune: -6 });
      reeds.push({ freq: freq,     amp: 0.95, detune:  8 });
      reeds.push({ freq: freq * 2, amp: 0.28, detune:  0 });
      reeds.push({ freq: freq / 2, amp: 0.55, detune:  0 });
    } else if (reedType === 'bass-male-female-female') {
      reeds.push({ freq: freq / 2, amp: 0.55, detune:  0 });
      reeds.push({ freq: freq,     amp: 1.00, detune:  0 });
      reeds.push({ freq: freq * 2, amp: 0.26, detune: -6 });
      reeds.push({ freq: freq * 2, amp: 0.24, detune:  8 });
    } else if (reedType === 'bass-bass-male-female') {
      reeds.push({ freq: freq / 2, amp: 0.52, detune: -5 });
      reeds.push({ freq: freq / 2, amp: 0.48, detune:  6 });
      reeds.push({ freq: freq,     amp: 1.00, detune:  0 });
      reeds.push({ freq: freq * 2, amp: 0.28, detune:  0 });
    } else {
      reeds.push({ freq: freq / 2, amp: 0.52, detune: 0 });
      if (reedType === 'bass-male-male') {
        reeds.push({ freq: freq, amp: 1.00, detune: -6 });
        reeds.push({ freq: freq, amp: 0.95, detune:  8 });
      } else {
        reeds.push({ freq: freq, amp: 1.00, detune:  0 });
      }
      if (reedType === 'bass-male-female') {
        reeds.push({ freq: freq * 2, amp: 0.28, detune: 0 });
      }
    }
    if (leftCoupler)  reeds.push({ freq: freq / 2, amp: 0.32, detune: -3 });
    if (rightCoupler) reeds.push({ freq: freq * 2, amp: 0.22, detune:  3 });

    const cabinet = buildHarmoniumCabinet(audioCtx, brand);

    const attack = 0.040, release = 0.080;
    const noteEnv = audioCtx.createGain();
    noteEnv.gain.setValueAtTime(0.0001, startTime);
    noteEnv.gain.exponentialRampToValueAtTime(1.0, startTime + attack);
    noteEnv.gain.setValueAtTime(1.0, startTime + Math.max(duration - release, attack + 0.005));
    noteEnv.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    cabinet.output.connect(noteEnv);
    noteEnv.connect(dest);

    const lfoPhaseOffset = Math.random() * 2;
    const bellows = audioCtx.createOscillator();
    const bellowsAmp = audioCtx.createGain();
    bellows.type = 'sine';
    bellows.frequency.value = 2.8 + Math.random() * 0.6;
    bellowsAmp.gain.value = 0.025;
    bellows.connect(bellowsAmp);
    bellowsAmp.connect(noteEnv.gain);
    bellows.start(startTime - lfoPhaseOffset);
    bellows.stop(startTime + duration + 0.1);
    oscillators.push(bellows);

    const volumeScale = 0.085 / Math.sqrt(reeds.length);
    const reedWave = getHarmoniumReedWave(audioCtx);
    for (const reed of reeds) {
      const reedGain = audioCtx.createGain();
      reedGain.gain.value = reed.amp * volumeScale;
      reedGain.connect(cabinet.input);
      const drift = (Math.random() - 0.5) * 4;
      const osc = audioCtx.createOscillator();
      osc.setPeriodicWave(reedWave);
      osc.frequency.value = reed.freq;
      osc.detune.value = reed.detune + drift;
      const pitchLfo = audioCtx.createOscillator();
      const pitchLfoGain = audioCtx.createGain();
      pitchLfo.type = 'sine';
      pitchLfo.frequency.value = bellows.frequency.value;
      pitchLfoGain.gain.value = 1.5;
      pitchLfo.connect(pitchLfoGain);
      pitchLfoGain.connect(osc.detune);
      pitchLfo.start(startTime - lfoPhaseOffset + Math.random() * 0.1);
      pitchLfo.stop(startTime + duration + 0.1);
      oscillators.push(pitchLfo);
      osc.connect(reedGain);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.1);
      oscillators.push(osc);
    }

    const chiffLen = Math.min(0.07, duration);
    const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * chiffLen));
    const chiffBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const chiffData = chiffBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) chiffData[i] = Math.random() * 2 - 1;
    const chiffSrc = audioCtx.createBufferSource();
    chiffSrc.buffer = chiffBuf;
    const chiffBP = audioCtx.createBiquadFilter();
    chiffBP.type = 'bandpass';
    chiffBP.frequency.value = Math.min(Math.max(freq * 3, 900), 4000);
    chiffBP.Q.value = 0.9;
    const chiffGain = audioCtx.createGain();
    const chiffPeak = volumeScale * 0.12;
    chiffGain.gain.setValueAtTime(0, startTime);
    chiffGain.gain.linearRampToValueAtTime(chiffPeak, startTime + 0.008);
    chiffGain.gain.exponentialRampToValueAtTime(0.0001, startTime + chiffLen);
    chiffSrc.connect(chiffBP);
    chiffBP.connect(chiffGain);
    chiffGain.connect(cabinet.input);
    chiffSrc.start(startTime);
    chiffSrc.stop(startTime + chiffLen + 0.02);
    oscillators.push(chiffSrc);

    return oscillators;
  }

  function midiNoteOn(note, velocity) {
    ensureMidiAudio();
    // Retrigger: release any note already sounding at this key.
    if (midiVoices.has(note)) { midiVoices.get(note).release(); midiVoices.delete(note); }

    const adjusted = note + midiOctaveShift * 12 + midiTranspose;
    const freq = midiNoteToFreq(adjusted);
    // Velocity sensitivity is opt-in. When off, every note plays at a fixed
    // moderate level (like a drone/harmonium held steady); when on, the key's
    // real velocity scales the loudness.
    const velScale = midiVelocity.checked ? (velocity || 96) / 127 : 0.75;

    const masterGain = midiAudioCtx.createGain();
    masterGain.gain.value = velScale;
    // Feed the shared dry+wet room bus so the reverb tail continues after
    // masterGain's release fade.
    const reverb = getHarmoniumReverbBus(midiAudioCtx, midiCompressor);
    masterGain.connect(reverb.input);

    const now = midiAudioCtx.currentTime;
    // Long max duration — the key is held; release() fades it out early.
    const oscillators = createHarmoniumNote(
      midiAudioCtx, masterGain, freq, now, 30,
      midiReedSelect.value, midiCouplerSelect.value === 'left',
      midiCouplerSelect.value === 'right', midiBrandSelect.value
    );

    midiVoices.set(note, {
      release() {
        if (!midiAudioCtx || midiAudioCtx.state === 'closed') return;
        const t = midiAudioCtx.currentTime;
        const val = masterGain.gain.value;
        if (val <= 0.0001) {
          for (const o of oscillators) { try { o.stop(); } catch (e) {} }
          try { masterGain.disconnect(); } catch (e) {}
          return;
        }
        masterGain.gain.cancelScheduledValues(t);
        masterGain.gain.setValueAtTime(val, t);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
        setTimeout(() => {
          for (const o of oscillators) { try { o.stop(); } catch (e) {} }
          try { masterGain.disconnect(); } catch (e) {}
        }, 130);
      }
    });
  }

  function midiNoteOff(note) {
    if (midiVoices.has(note)) { midiVoices.get(note).release(); midiVoices.delete(note); }
  }

  function allMidiNotesOff() {
    for (const v of midiVoices.values()) v.release();
    midiVoices.clear();
  }

  function onMidiMessage(e) {
    const [status, note, velocity] = e.data;
    const cmd = status & 0xf0;
    if (cmd === 0x90 && velocity > 0) midiNoteOn(note, velocity);
    else if (cmd === 0x80 || (cmd === 0x90 && velocity === 0)) midiNoteOff(note);
    else if (cmd === 0xb0 && note === 123) allMidiNotesOff(); // all-notes-off
  }

  function listenTo(input) {
    if (midiInput) midiInput.onmidimessage = null;
    midiInput = input;
    if (input) input.onmidimessage = onMidiMessage;
  }

  function populateMidiDevices() {
    if (!midiAccess) return;
    const inputs = Array.from(midiAccess.inputs.values());
    midiDeviceSelect.innerHTML = "";
    if (inputs.length === 0) {
      const o = document.createElement("option");
      o.textContent = "No devices found";
      midiDeviceSelect.appendChild(o);
      midiStatus.textContent = "No MIDI devices found";
      listenTo(null);
      setMidiConnectedUI(false);
      return;
    }
    inputs.forEach((inp, i) => {
      const o = document.createElement("option");
      o.value = inp.id;
      o.textContent = inp.name || ("MIDI Input " + (i + 1));
      midiDeviceSelect.appendChild(o);
    });
    // keep current selection if still present, else first device
    const keep = midiInput && inputs.some(i => i.id === midiInput.id) ? midiInput
               : inputs[0];
    midiDeviceSelect.value = keep.id;
    listenTo(keep);
    midiStatus.textContent = "Connected: " + (keep.name || "MIDI Device");
    setMidiConnectedUI(true);
  }

  function setMidiConnectedUI(on) {
    midiToggle.classList.toggle("connected", on);
    midiToggle.textContent = on ? "🎹 MIDI ●" : "🎹 MIDI";
  }

  async function connectMidi() {
    if (!navigator.requestMIDIAccess) {
      midiStatus.textContent = "Web MIDI not supported in this browser";
      midiPopover.classList.add("open");
      return;
    }
    try {
      midiAccess = await navigator.requestMIDIAccess();
      ensureMidiAudio();  // user gesture — unlock audio
      midiAccess.onstatechange = populateMidiDevices;
      populateMidiDevices();
    } catch (e) {
      midiStatus.textContent = "MIDI access denied";
    }
  }

  function disconnectMidi() {
    allMidiNotesOff();
    listenTo(null);
    setMidiConnectedUI(false);
    midiStatus.textContent = "Not connected";
  }

  let midiEnabled = false;
  midiToggle.addEventListener("click", () => {
    midiEnabled = !midiEnabled;
    if (midiEnabled) {
      connectMidi();
      midiPopover.classList.add("open");   // reveal config when turned on
    } else {
      disconnectMidi();
    }
  });
  midiConfigBtn.addEventListener("click", () => midiPopover.classList.toggle("open"));
  // close popover on outside click
  document.addEventListener("click", (e) => {
    if (!midiPopover.classList.contains("open")) return;
    if (!e.target.closest(".midi-group")) midiPopover.classList.remove("open");
  });

  midiDeviceSelect.addEventListener("change", (e) => {
    if (!midiAccess) return;
    const input = Array.from(midiAccess.inputs.values()).find(i => i.id === e.target.value);
    if (input) { listenTo(input); midiStatus.textContent = "Connected: " + (input.name || "MIDI Device"); }
  });

  document.getElementById("midiOctDown").addEventListener("click", () => {
    if (midiOctaveShift > -3) { midiOctaveShift--; midiOctVal.textContent = fmtShift(midiOctaveShift); }
  });
  document.getElementById("midiOctUp").addEventListener("click", () => {
    if (midiOctaveShift < 3) { midiOctaveShift++; midiOctVal.textContent = fmtShift(midiOctaveShift); }
  });
  document.getElementById("midiTransDown").addEventListener("click", () => {
    if (midiTranspose > -12) { midiTranspose--; midiTransVal.textContent = fmtShift(midiTranspose); }
  });
  document.getElementById("midiTransUp").addEventListener("click", () => {
    if (midiTranspose < 12) { midiTranspose++; midiTransVal.textContent = fmtShift(midiTranspose); }
  });

  // ─────────────────────────────────────────────────────────────
  //  METRONOME
  //  A steady click track with adjustable tempo (BPM), beats-per-bar,
  //  and tap tempo. Clicks are scheduled ahead of time on a dedicated
  //  AudioContext using the standard look-ahead scheduler pattern, so
  //  timing stays rock-solid regardless of frame rate. The accented
  //  first beat of each bar gets a higher-pitched click.
  // ─────────────────────────────────────────────────────────────
  const metroToggle = document.getElementById("metroToggle");
  const metroConfigBtn = document.getElementById("metroConfigBtn");
  const metroPopover = document.getElementById("metroPopover");
  const metroBeatsEl = document.getElementById("metroBeats");
  const metroBpmSlider = document.getElementById("metroBpmSlider");
  const metroBpmNum = document.getElementById("metroBpmNum");
  const metroBpmDown = document.getElementById("metroBpmDown");
  const metroBpmUp = document.getElementById("metroBpmUp");
  const metroBeatsSelect = document.getElementById("metroBeatsSelect");
  const metroStartStop = document.getElementById("metroStartStop");
  const metroTap = document.getElementById("metroTap");

  let metroAudioCtx = null;
  let metroRunning = false;
  let metroBpm = 80;
  let metroBeatsPerBar = 4;
  let metroNextNoteTime = 0;   // AudioContext time of the next click
  let metroBeatInBar = 0;      // 0-based beat index within the current bar
  let metroTimer = null;       // setInterval id for the scheduler
  const METRO_LOOKAHEAD = 0.1; // seconds to schedule ahead
  const METRO_INTERVAL = 25;   // ms between scheduler ticks
  let metroTapTimes = [];      // recent tap timestamps (ms) for tap tempo

  function buildBeatDots() {
    metroBeatsEl.innerHTML = "";
    for (let i = 0; i < metroBeatsPerBar; i++) {
      const d = document.createElement("div");
      d.className = "beat" + (i === 0 ? " accent" : "");
      metroBeatsEl.appendChild(d);
    }
  }

  function setMetroBpm(bpm) {
    metroBpm = Math.max(30, Math.min(250, Math.round(bpm)));
    metroBpmSlider.value = metroBpm;
    metroBpmNum.value = metroBpm;
  }

  function scheduleClick(beat, time) {
    // Highlight the beat dot in sync with the scheduled audio time.
    const delayMs = Math.max(0, (time - metroAudioCtx.currentTime) * 1000);
    setTimeout(() => {
      const dots = metroBeatsEl.children;
      for (const d of dots) d.classList.remove("active");
      if (dots[beat]) dots[beat].classList.add("active");
    }, delayMs);

    const osc = metroAudioCtx.createOscillator();
    const gain = metroAudioCtx.createGain();
    const accent = beat === 0;
    osc.type = "sine";
    osc.frequency.value = accent ? 1600 : 1000;
    const peak = accent ? 0.5 : 0.32;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(peak, time + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    osc.connect(gain);
    gain.connect(metroAudioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.06);
  }

  function metroScheduler() {
    const secondsPerBeat = 60.0 / metroBpm;
    while (metroNextNoteTime < metroAudioCtx.currentTime + METRO_LOOKAHEAD) {
      scheduleClick(metroBeatInBar, metroNextNoteTime);
      metroNextNoteTime += secondsPerBeat;
      metroBeatInBar++;
      if (metroBeatInBar >= metroBeatsPerBar) metroBeatInBar = 0;
    }
  }

  function startMetro() {
    if (metroRunning) return;
    if (!metroAudioCtx || metroAudioCtx.state === "closed") {
      metroAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (metroAudioCtx.state === "suspended") metroAudioCtx.resume();
    metroRunning = true;
    metroBeatInBar = 0;
    metroNextNoteTime = metroAudioCtx.currentTime + 0.05;
    metroTimer = setInterval(metroScheduler, METRO_INTERVAL);
    metroToggle.classList.add("on");
    metroStartStop.classList.add("running");
    metroStartStop.textContent = "■ Stop";
  }

  function stopMetro() {
    metroRunning = false;
    if (metroTimer) { clearInterval(metroTimer); metroTimer = null; }
    for (const d of metroBeatsEl.children) d.classList.remove("active");
    metroToggle.classList.remove("on");
    metroStartStop.classList.remove("running");
    metroStartStop.textContent = "▶ Start";
  }

  function toggleMetro() {
    if (metroRunning) {
      stopMetro();
    } else {
      startMetro();
      metroPopover.classList.add("open");   // reveal config when turned on
    }
  }

  buildBeatDots();
  setMetroBpm(metroBpm);

  metroToggle.addEventListener("click", toggleMetro);
  metroStartStop.addEventListener("click", toggleMetro);
  metroConfigBtn.addEventListener("click", () => metroPopover.classList.toggle("open"));
  document.addEventListener("click", (e) => {
    if (!metroPopover.classList.contains("open")) return;
    if (!e.target.closest(".metro-group")) metroPopover.classList.remove("open");
  });

  metroBpmSlider.addEventListener("input", () => setMetroBpm(parseInt(metroBpmSlider.value, 10)));
  metroBpmDown.addEventListener("click", () => setMetroBpm(metroBpm - 1));
  metroBpmUp.addEventListener("click", () => setMetroBpm(metroBpm + 1));
  // Editable BPM field: commit on change / Enter, re-clamp to the valid range.
  metroBpmNum.addEventListener("change", () => {
    const v = parseInt(metroBpmNum.value, 10);
    setMetroBpm(isNaN(v) ? metroBpm : v);
  });
  metroBpmNum.addEventListener("keydown", (e) => { if (e.key === "Enter") metroBpmNum.blur(); });
  metroBeatsSelect.addEventListener("change", () => {
    metroBeatsPerBar = parseInt(metroBeatsSelect.value, 10);
    metroBeatInBar = 0;
    buildBeatDots();
  });

  // Tap tempo: average the interval of the last few taps (within 2 s).
  metroTap.addEventListener("click", () => {
    const now = performance.now();
    if (metroTapTimes.length && now - metroTapTimes[metroTapTimes.length - 1] > 2000) {
      metroTapTimes = [];
    }
    metroTapTimes.push(now);
    if (metroTapTimes.length > 5) metroTapTimes.shift();
    if (metroTapTimes.length >= 2) {
      let sum = 0;
      for (let i = 1; i < metroTapTimes.length; i++) sum += metroTapTimes[i] - metroTapTimes[i - 1];
      const avgMs = sum / (metroTapTimes.length - 1);
      setMetroBpm(60000 / avgMs);
    }
  });

  // Initial render
  resizeCanvas();
  draw();
})();
</script>
</body>
</html>
